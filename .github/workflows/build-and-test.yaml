name: Build and Test
run-name: "${{ github.actor }} building and testing cetmodules"

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fnalssi/cetmodules-dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cmake -S . -B build -DBUILD_DOCS=ON -DBUILD_TESTING=ON

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
